name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/validate.js
      - run: node tools/test.js
      - run: node tools/simulate.js 300

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build:www

      - name: Create Android project
        run: npx cap add android

      - name: Set version from run number
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk crown-of-ash-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: crown-of-ash-debug-apk
          path: crown-of-ash-debug.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Crown of Ash (latest build)
          prerelease: true
          body: |
            Debug APK built from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Install on Android: download `crown-of-ash-debug.apk`, allow installs from your browser/file manager, open it.
          files: crown-of-ash-debug.apk
